name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & test (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ["21"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Verify (compile, tests, coverage gate)
        run: ./mvnw -B -ntp verify
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-jdk${{ matrix.java }}
          path: |
            target/surefire-reports
            target/site/jacoco
      - name: Benchmark smoke run
        run: >
          ./mvnw -B -ntp -q exec:java
          -Dexec.args="--seeds 2 --iterations 20000 --sizes small --out target/benchmark-smoke"
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-smoke
          path: target/benchmark-smoke

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: smartcampus:ci
      - name: Smoke-test container
        run: |
          docker run -d --name sc -p 8080:8080 smartcampus:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/actuator/health | grep -q UP; then break; fi
            sleep 2
          done
          curl -fsS http://localhost:8080/api/v1/timetabling/solvers
          docker logs sc
