name: Bug report
description: Something behaves incorrectly
labels: [bug]
body:
  - type: textarea
    attributes:
      label: What happened?
      description: Include the exact command or request and the observed output.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    attributes:
      label: Reproduction
      description: Minimal steps, including seeds and solver/instance parameters where relevant.
  - type: input
    attributes:
      label: Version / commit
